<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System - Belart Website</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Belart Academy Portal</h1>
        <a href="index.html" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded">Back to Main Site</a>
    </nav>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Section 1: Student Registration Form -->
        <section class="bg-white p-6 rounded-lg shadow-md md:col-span-1">
            <h2 class="text-lg font-semibold mb-4 text-blue-600">Register New Student</h2>
            <form id="studentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" required class="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Student ID</label>
                    <input type="text" id="studentId" required class="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Grade Level</label>
                    <select id="gradeLevel" class="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                        <option value="Grade 9">Grade 9</option>
                        <option value="Grade 10">Grade 10</option>
                        <option value="Grade 11">Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Major / Track</label>
                    <input type="text" id="major" placeholder="e.g., STEM, Arts" required class="mt-1 w-full p-2 border border-gray-300 rounded">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded transition">Add Student</button>
            </form>
        </section>

        <!-- Section 2: Student Directory & Management -->
        <section class="bg-white p-6 rounded-lg shadow-md md:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-blue-600">Enrolled Students Directory</h2>
                <span id="studentCount" class="text-sm bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-medium">0 Students</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b text-sm text-gray-600">
                            <th class="p-3">ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Grade</th>
                            <th class="p-3">Major</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- Dynamically injected rows via JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript for Client-Side Management -->
    <script>
        document.addEventListener("DOMContentLoaded", loadStudents);

        const form = document.getElementById("studentForm");
        const tableBody = document.getElementById("studentTableBody");
        const countBadge = document.getElementById("studentCount");

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            
            const student = {
                id: document.getElementById("studentId").value.trim(),
                name: document.getElementById("name").value.trim(),
                grade: document.getElementById("gradeLevel").value,
                major: document.getElementById("major").value.trim()
            };

            let students = JSON.parse(localStorage.getItem("belart_students")) || [];
            
            // Prevent duplicate IDs
            if(students.some(s => s.id === student.id)) {
                alert("A student with this ID already exists.");
                return;
            }

            students.push(student);
            localStorage.setItem("belart_students", JSON.stringify(students));
            
            form.reset();
            loadStudents();
        });

        function loadStudents() {
            let students = JSON.parse(localStorage.getItem("belart_students")) || [];
            tableBody.innerHTML = "";
            
            countBadge.innerText = `${students.length} Student${students.length === 1 ? '' : 's'}`;

            if(students.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No student records found.</td></tr>`;
                return;
            }

            students.forEach((s, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td class="p-3 font-medium">${s.id}</td>
                    <td class="p-3">${s.name}</td>
                    <td class="p-3">${s.grade}</td>
                    <td class="p-3">${s.major}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteStudent(${index})" class="text-red-500 hover:text-red-700 font-medium text-xs bg-red-50 px-2 py-1 rounded">Remove</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        window.deleteStudent = function(index) {
            let students = JSON.parse(localStorage.getItem("belart_students")) || [];
            students.splice(index, 1);
            localStorage.setItem("belart_students", JSON.stringify(students));
            loadStudents();
        }
    </script>
</body>
</html>
